name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, migrations, and unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine3.23
        env:
          POSTGRES_DB: arctic_rss
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d arctic_rss"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:ci-postgres-password@localhost:5432/arctic_rss?schema=public
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check Prisma formatting and schema
        run: |
          npx prisma format --check
          npx prisma validate
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Classify changed migration risk
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$MIGRATION_BASE_SHA" ]; then
            npm run migration:risk -- --base "$MIGRATION_BASE_SHA"
          else
            echo "No comparison base was supplied; no changed migrations to classify."
          fi
      - name: Apply and verify migrations
        run: |
          npm run prisma:deploy
          npx prisma migrate status
          npx prisma migrate diff --from-config-datasource --to-schema=prisma/schema.prisma --exit-code
      - name: Run unit, concurrency, and security regression tests
        run: npm test
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build production application
        run: npm run build

  browser-smoke:
    name: Browser smoke and reader journeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine3.23
        env:
          POSTGRES_DB: arctic_rss
          POSTGRES_PASSWORD: csp-e2e-database-password
          POSTGRES_USER: csp_e2e
        options: >-
          --health-cmd "pg_isready -U csp_e2e -d arctic_rss"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      E2E_DATABASE_URL: postgresql://csp_e2e:csp-e2e-database-password@localhost:5432/arctic_rss?schema=public
      E2E_DURABLE_REDIS_URL: redis://:csp-e2e-redis-password@localhost:6379
      E2E_EPHEMERAL_REDIS_URL: redis://:csp-e2e-redis-password@localhost:6380
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Start isolated durable and ephemeral Redis services
        run: |
          docker run --detach --name arctic-rss-e2e-durable-redis --publish 6379:6379 redis:7.4.9-alpine3.21 redis-server --appendonly yes --requirepass csp-e2e-redis-password
          docker run --detach --name arctic-rss-e2e-ephemeral-redis --publish 6380:6379 redis:7.4.9-alpine3.21 redis-server --save "" --requirepass csp-e2e-redis-password
          docker exec arctic-rss-e2e-durable-redis redis-cli --no-auth-warning -a csp-e2e-redis-password ping
          docker exec arctic-rss-e2e-ephemeral-redis redis-cli --no-auth-warning -a csp-e2e-redis-password ping
      - name: Apply browser-test migrations
        run: DATABASE_URL="$E2E_DATABASE_URL" npm run prisma:deploy
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production application for browser verification
        run: npm run build
      - name: Run browser smoke and authenticated reader journeys against the production server
        run: E2E_PRODUCTION=1 ARCTIC_RSS_E2E_AUTHENTICATED=1 npm run test:e2e
      - name: Capture Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          if-no-files-found: ignore
          name: browser-test-artifacts
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Stop isolated Redis services
        if: always()
        run: docker rm --force arctic-rss-e2e-durable-redis arctic-rss-e2e-ephemeral-redis || true

  dependency-review:
    name: Dependency review
    # GitHub makes this action available on private repositories only with
    # Advanced Security. The installed dependency audit below remains required
    # for every repository; run the PR-diff review when GitHub supports it.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review introduced dependency vulnerabilities
        uses: actions/dependency-review-action@56339e523c0409420f6c2c9a2f4292bbb3c07dd3 # v4.8.0
        with:
          fail-on-severity: high

  chat-release-gates:
    name: Compose-backed chat release gates (${{ matrix.topology }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        topology: [all-in-one-with-chat, split-with-chat]
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Configure isolated production-like Compose environment
        run: |
          cp .env.example .env
          sed -i \
            -e 's/CHANGE_ME_LOCAL_DATABASE_PASSWORD/ci-postgres-password/' \
            -e 's/CHANGE_ME_LOCAL_RUNTIME_PASSWORD/ci-runtime-password/' \
            -e 's/CHANGE_ME_LOCAL_MIGRATE_PASSWORD/ci-migration-password/' \
            -e 's/CHANGE_ME_LOCAL_REDIS_PASSWORD/ci-redis-password/g' \
            -e 's/CHANGE_ME_GENERATE_A_32_BYTE_SECRET/ci-auth-secret-that-is-at-least-32-bytes/' \
            -e 's/CHANGE_ME_GENERATE_A_SEPARATE_32_BYTE_SECRET/ci-chat-token-secret-that-is-at-least-32-bytes/g' \
            -e 's#^DATABASE_URL=.*#DATABASE_URL=postgresql://postgres:ci-postgres-password@postgres:5432/arctic_rss?schema=public#' \
            -e 's#^MIGRATE_DATABASE_URL=.*#MIGRATE_DATABASE_URL=postgresql://postgres:ci-postgres-password@postgres:5432/arctic_rss?schema=public#' \
            -e 's#APP_ORIGIN=http://localhost:3000#APP_ORIGIN=https://arcticrss.test#' \
            -e 's#AUTH_URL=http://localhost:3000#AUTH_URL=https://arcticrss.test#' \
            -e 's/ARCTIC_IRC_ENABLED=false/ARCTIC_IRC_ENABLED=true/' \
            .env
      - name: Validate selected topology and Compose services
        run: npm run topology:validate -- --topology ${{ matrix.topology }}
      - name: Start the selected web, worker, Redis, database, and chat topology
        run: >-
          node scripts/ci/compose-topology.mjs --topology ${{ matrix.topology }} --
          up --build --detach --wait --wait-timeout 300
      - name: Verify selected worker ownership, CSP, and chat readiness
        run: |
          node scripts/ci/assert-running-topology.mjs ${{ matrix.topology }}
          node scripts/ci/assert-compose-chat-release-gates.mjs
      - name: Verify chat gateway recovery after ephemeral Redis restart
        run: |
          node scripts/ci/compose-topology.mjs --topology ${{ matrix.topology }} -- restart redis-ephemeral
          node scripts/ci/assert-running-topology.mjs ${{ matrix.topology }}
          node scripts/ci/assert-compose-chat-release-gates.mjs --after-redis-restart
      - name: Run authenticated, real-time, worker, retention, and CSP release gates
        run: npm run test:chat:release-gates
      - name: Capture Compose status on failure
        if: failure()
        run: |
          node scripts/ci/compose-topology.mjs --topology ${{ matrix.topology }} -- ps
          node scripts/ci/compose-topology.mjs --topology ${{ matrix.topology }} -- logs --no-color chat-gateway
      - name: Stop Compose topology
        if: always()
        run: node scripts/ci/compose-topology.mjs --topology ${{ matrix.topology }} -- down --volumes --remove-orphans

  dependency-audit:
    name: Installed dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Fail on high or critical production dependency vulnerabilities
        run: node scripts/security/audit-production-dependencies.mjs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect committed credentials
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  codeql:
    name: Static analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze source
        uses: github/codeql-action/analyze@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          category: /language:javascript-typescript

  container-security:
    name: Container scan and SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Validate production Compose topology and logging driver
        run: |
          cp .env.example .env
          sed -i \
            -e 's/CHANGE_ME_LOCAL_DATABASE_PASSWORD/ci-postgres-password/' \
            -e 's/CHANGE_ME_LOCAL_RUNTIME_PASSWORD/ci-runtime-password/' \
            -e 's/CHANGE_ME_LOCAL_MIGRATE_PASSWORD/ci-migration-password/' \
            -e 's/CHANGE_ME_LOCAL_REDIS_PASSWORD/ci-redis-password/g' \
            -e 's/CHANGE_ME_GENERATE_A_32_BYTE_SECRET/ci-auth-secret-that-is-at-least-32-bytes/' \
            .env
          docker compose config -q
          npm run topology:validate
          npm run compose:verify-env
          npm run compatibility:verify-legacy-redis
          docker info --format '{{range .Plugins.Log}}{{println .}}{{end}}' | grep -qx journald
          rm .env
      - name: Build production web image
        run: docker build --target runner --tag arctic-rss-web:ci .
      - name: Build production worker image
        run: docker build --target worker --tag arctic-rss-worker:ci .
      - name: Build production chat gateway image
        run: docker build --target chat-gateway --tag arctic-rss-chat-gateway:ci .
      - name: Build production migration image
        run: docker build --target migrate --tag arctic-rss-migrate:ci .
      - name: Record production image sizes
        run: |
          docker image inspect \
            --format '{{range .RepoTags}}{{.}} {{end}}{{.Size}} bytes' \
            arctic-rss-web:ci \
            arctic-rss-worker:ci \
            arctic-rss-chat-gateway:ci \
            arctic-rss-migrate:ci | tee image-sizes.txt
      - name: Upload production image sizes
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: arctic-rss-image-sizes
          path: image-sizes.txt
          if-no-files-found: error
          retention-days: 30
      - name: Scan web image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: arctic-rss-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
      - name: Scan worker image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: arctic-rss-worker:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
          skip-setup-trivy: true
      - name: Scan chat gateway image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: arctic-rss-chat-gateway:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
          skip-setup-trivy: true
      - name: Scan migration image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: arctic-rss-migrate:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
          skip-setup-trivy: true
      - name: Generate web image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: arctic-rss-web-sbom
          image: arctic-rss-web:ci
          upload-artifact-retention: 30
      - name: Generate worker image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: arctic-rss-worker-sbom
          image: arctic-rss-worker:ci
          upload-artifact-retention: 30
      - name: Generate chat gateway image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: arctic-rss-chat-gateway-sbom
          image: arctic-rss-chat-gateway:ci
          upload-artifact-retention: 30
      - name: Generate migration image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: arctic-rss-migrate-sbom
          image: arctic-rss-migrate:ci
          upload-artifact-retention: 30
