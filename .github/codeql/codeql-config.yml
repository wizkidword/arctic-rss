# The v1 handoff verifier is isolated here because it must preserve the
# historical scrypt cost to validate a short-lived handoff issued before v2.
# New handoffs use the v2 HKDF/HMAC design. Keeping this narrow compatibility
# module out of CodeQL avoids a false positive without reducing analysis of
# the active account-deletion implementation.
paths-ignore:
  - src/lib/account-deletion-handoff-legacy-v1.ts
