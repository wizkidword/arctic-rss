map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;

  location = /socket.io {
    client_max_body_size 64k;
    proxy_pass http://chat-gateway:3001;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 75s;
    proxy_set_header Host $http_host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location ^~ /socket.io/ {
    client_max_body_size 64k;
    proxy_pass http://chat-gateway:3001;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 75s;
    proxy_set_header Host $http_host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # The HTTPS App Link callback carries a one-time authorization code in its
  # query string. Do not let an edge access-log format retain that secret when
  # Android falls back to this browser route.
  location = /mobile/auth/callback {
    access_log off;
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }
}
