      INGESTION_MAX_TITLE_CHARACTERS: ${INGESTION_MAX_TITLE_CHARACTERS:-}
      INGESTION_MAX_URL_CHARACTERS: ${INGESTION_MAX_URL_CHARACTERS:-}
