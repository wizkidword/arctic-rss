x-worker-runtime: &worker-runtime
  image: ${WORKER_IMAGE:-arctic-rss-worker}
  build:
    context: .
    target: worker
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    redis-ephemeral:
      condition: service_healthy
  stop_grace_period: 60s
  command: ["node", "worker.mjs"]
  logging:
    driver: journald

services:
  postgres:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 512m
    pids_limit: 128
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arctic_rss}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging:
      driver: journald
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7.4.9-alpine3.21
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 320m
    pids_limit: 64
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # Durable BullMQ data must never be evicted. Keep a memory margin below the
    # container limit so Redis can safely rewrite AOF files under load.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--auto-aof-rewrite-min-size", "64mb", "--auto-aof-rewrite-percentage", "100", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data
    logging:
      driver: journald
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  redis-ephemeral:
    image: redis:7.4.9-alpine3.21
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 192m
    pids_limit: 64
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # Socket.IO, presence, replay, rate-limit, and security-event state is
    # intentionally disposable. Every application key has a bounded TTL, so
    # volatile-ttl can reclaim the shortest-lived state under memory pressure.
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: journald
    # Loopback only preserves direct-host development and operator diagnostics;
    # no Redis service is reachable from the public network.
    ports:
      - "127.0.0.1:${EPHEMERAL_REDIS_PORT:-6380}:6379"

  migrate:
    image: ${MIGRATE_IMAGE:-arctic-rss-migrate}
    build:
      context: .
      target: migrate
    environment:
      # Production migrations use a distinct role that owns the schema. The
      # web and worker containers retain the lower-privilege DATABASE_URL.
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?MIGRATE_DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: journald

  web:
    image: ${WEB_IMAGE:-arctic-rss-web}
    build:
      context: .
      target: runner
      args:
        APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cpus: 0.75
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    environment:
      ARCTIC_RSS_SERVICE_ROLE: web
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DURABLE_REDIS_URL: ${DURABLE_REDIS_URL:?DURABLE_REDIS_URL is required}
      EPHEMERAL_REDIS_URL: ${EPHEMERAL_REDIS_URL:?EPHEMERAL_REDIS_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_URL: ${AUTH_URL:?AUTH_URL is required}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-}
      SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-}
      SMTP_SEND_TIMEOUT_MS: ${SMTP_SEND_TIMEOUT_MS:-}
      SMTP_POOL_MAX_CONNECTIONS: ${SMTP_POOL_MAX_CONNECTIONS:-}
      TURNSTILE_REQUIRED: ${TURNSTILE_REQUIRED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-}
      AI_DIGEST_MODEL: ${AI_DIGEST_MODEL:-}
      STORY_COMPARISON_MODEL: ${STORY_COMPARISON_MODEL:-}
      ARCTIC_IRC_ENABLED: ${ARCTIC_IRC_ENABLED:-false}
      ARCTIC_IRC_BETA_ALLOWLIST_ENABLED: ${ARCTIC_IRC_BETA_ALLOWLIST_ENABLED:-false}
      ARCTIC_IRC_GUEST_PREVIEW_ENABLED: ${ARCTIC_IRC_GUEST_PREVIEW_ENABLED:-false}
      ARCTIC_IRC_ROOM_CREATION_ENABLED: ${ARCTIC_IRC_ROOM_CREATION_ENABLED:-false}
      ARCTIC_IRC_DMS_ENABLED: ${ARCTIC_IRC_DMS_ENABLED:-false}
      ARCTIC_IRC_BOT_ENABLED: ${ARCTIC_IRC_BOT_ENABLED:-false}
      ARCTIC_IRC_EXTERNAL_ENABLED: ${ARCTIC_IRC_EXTERNAL_ENABLED:-false}
      ARCTIC_IRC_EXTERNAL_OFTC_ENABLED: ${ARCTIC_IRC_EXTERNAL_OFTC_ENABLED:-false}
      ARCTIC_IRC_EXTERNAL_LIBERA_ENABLED: ${ARCTIC_IRC_EXTERNAL_LIBERA_ENABLED:-false}
      ARCTIC_IRC_TOKEN_SECRET: ${ARCTIC_IRC_TOKEN_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-ephemeral:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/live').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    logging:
      driver: journald

  worker:
    <<: *worker-runtime
    profiles: ["all-in-one"]
    cpus: 0.75
    mem_limit: 1g
    pids_limit: 256
    environment:
      ARCTIC_RSS_SERVICE_ROLE: worker-all
      NODE_OPTIONS: "--max-old-space-size=640"
      WORKER_MODE: "all"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DURABLE_REDIS_URL: ${DURABLE_REDIS_URL:?DURABLE_REDIS_URL is required}
      EPHEMERAL_REDIS_URL: ${EPHEMERAL_REDIS_URL:?EPHEMERAL_REDIS_URL is required}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      AI_PROVIDER: ${AI_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-}
      AI_DIGEST_MODEL: ${AI_DIGEST_MODEL:-}
      AI_DIGEST_CONCURRENCY: ${AI_DIGEST_CONCURRENCY:-}
      SMART_DIGEST_CONCURRENCY: ${SMART_DIGEST_CONCURRENCY:-}
      SMART_DIGEST_EMAIL_CONCURRENCY: ${SMART_DIGEST_EMAIL_CONCURRENCY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-}
      SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-}
      SMTP_SEND_TIMEOUT_MS: ${SMTP_SEND_TIMEOUT_MS:-}
      SMTP_POOL_MAX_CONNECTIONS: ${SMTP_POOL_MAX_CONNECTIONS:-}
      FEED_REFRESH_CONCURRENCY: ${FEED_REFRESH_CONCURRENCY:-}
      FEED_SCHEDULER_BATCH_SIZE: ${FEED_SCHEDULER_BATCH_SIZE:-}
      FEED_SCHEDULER_INTERVAL_MS: ${FEED_SCHEDULER_INTERVAL_MS:-}
      PODCAST_REFRESH_CONCURRENCY: ${PODCAST_REFRESH_CONCURRENCY:-}
      SAVED_MONITOR_BATCH_SIZE: ${SAVED_MONITOR_BATCH_SIZE:-}
      SAVED_MONITOR_MATCH_BATCH_SIZE: ${SAVED_MONITOR_MATCH_BATCH_SIZE:-}
      SAVED_MONITOR_INTERVAL_MS: ${SAVED_MONITOR_INTERVAL_MS:-}
      AUTH_TOKEN_MAINTENANCE_BATCH_SIZE: ${AUTH_TOKEN_MAINTENANCE_BATCH_SIZE:-}
      AUTH_TOKEN_MAINTENANCE_INTERVAL_MS: ${AUTH_TOKEN_MAINTENANCE_INTERVAL_MS:-}
      SECURITY_EVENT_MAINTENANCE_BATCH_SIZE: ${SECURITY_EVENT_MAINTENANCE_BATCH_SIZE:-}
      SECURITY_EVENT_MAINTENANCE_INTERVAL_MS: ${SECURITY_EVENT_MAINTENANCE_INTERVAL_MS:-}
      CHAT_EVENT_OUTBOX_PUBLISH_INTERVAL_MS: ${CHAT_EVENT_OUTBOX_PUBLISH_INTERVAL_MS:-}
      ARCTIC_IRC_ENABLED: ${ARCTIC_IRC_ENABLED:-false}
      ARCTIC_IRC_BOT_ENABLED: ${ARCTIC_IRC_BOT_ENABLED:-false}
      ARCTIC_IRC_RETENTION_BATCH_SIZE: ${ARCTIC_IRC_RETENTION_BATCH_SIZE:-}
      ARCTIC_IRC_RETENTION_INTERVAL_MS: ${ARCTIC_IRC_RETENTION_INTERVAL_MS:-}
      ARCTIC_IRC_RETENTION_MAX_BATCHES: ${ARCTIC_IRC_RETENTION_MAX_BATCHES:-}
      ARCTIC_IRC_RETENTION_MAX_RUNTIME_MS: ${ARCTIC_IRC_RETENTION_MAX_RUNTIME_MS:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs = require('node:fs'); try { const age = Date.now() - fs.statSync('/tmp/arctic-rss-worker-heartbeat').mtimeMs; process.exit(age < 90000 ? 0 : 1) } catch { process.exit(1) }",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker-ingestion:
    <<: *worker-runtime
    profiles: ["split-workers"]
    cpus: 0.5
    mem_limit: 640m
    pids_limit: 192
    environment:
      ARCTIC_RSS_SERVICE_ROLE: worker-ingestion
      NODE_OPTIONS: "--max-old-space-size=384"
      WORKER_MODE: ingestion
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DURABLE_REDIS_URL: ${DURABLE_REDIS_URL:?DURABLE_REDIS_URL is required}
      FEED_REFRESH_CONCURRENCY: ${FEED_REFRESH_CONCURRENCY:-}
      PODCAST_REFRESH_CONCURRENCY: ${PODCAST_REFRESH_CONCURRENCY:-}
      ARCTIC_IRC_ENABLED: ${ARCTIC_IRC_ENABLED:-false}
      ARCTIC_IRC_BOT_ENABLED: ${ARCTIC_IRC_BOT_ENABLED:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "const fs = require('node:fs'); try { const age = Date.now() - fs.statSync('/tmp/arctic-rss-worker-heartbeat-ingestion').mtimeMs; process.exit(age < 90000 ? 0 : 1) } catch { process.exit(1) }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker-ai-mail:
    <<: *worker-runtime
    profiles: ["split-workers"]
    cpus: 0.75
    mem_limit: 768m
    pids_limit: 192
    environment:
      ARCTIC_RSS_SERVICE_ROLE: worker-ai-mail
      NODE_OPTIONS: "--max-old-space-size=512"
      WORKER_MODE: ai-mail
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DURABLE_REDIS_URL: ${DURABLE_REDIS_URL:?DURABLE_REDIS_URL is required}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      AI_PROVIDER: ${AI_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-}
      AI_DIGEST_MODEL: ${AI_DIGEST_MODEL:-}
      AI_DIGEST_CONCURRENCY: ${AI_DIGEST_CONCURRENCY:-}
      SMART_DIGEST_CONCURRENCY: ${SMART_DIGEST_CONCURRENCY:-}
      SMART_DIGEST_EMAIL_CONCURRENCY: ${SMART_DIGEST_EMAIL_CONCURRENCY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-}
      SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-}
      SMTP_SEND_TIMEOUT_MS: ${SMTP_SEND_TIMEOUT_MS:-}
      SMTP_POOL_MAX_CONNECTIONS: ${SMTP_POOL_MAX_CONNECTIONS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "const fs = require('node:fs'); try { const age = Date.now() - fs.statSync('/tmp/arctic-rss-worker-heartbeat-ai-mail').mtimeMs; process.exit(age < 90000 ? 0 : 1) } catch { process.exit(1) }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker-imports:
    <<: *worker-runtime
    profiles: ["split-workers"]
    cpus: 0.5
    mem_limit: 768m
    pids_limit: 192
    environment:
      ARCTIC_RSS_SERVICE_ROLE: worker-imports
      NODE_OPTIONS: "--max-old-space-size=512"
      WORKER_MODE: imports
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DURABLE_REDIS_URL: ${DURABLE_REDIS_URL:?DURABLE_REDIS_URL is required}
    healthcheck:
      test: ["CMD", "node", "-e", "const fs = require('node:fs'); try { const age = Date.now() - fs.statSync('/tmp/arctic-rss-worker-heartbeat-imports').mtimeMs; process.exit(age < 90000 ? 0 : 1) } catch { process.exit(1) }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker-maintenance:
    <<: *worker-runtime
    profiles: ["split-workers"]
    cpus: 0.35
    mem_limit: 384m
    pids_limit: 128
    environment:
      ARCTIC_RSS_SERVICE_ROLE: worker-maintenance
      NODE_OPTIONS: "--max-old-space-size=256"
      WORKER_MODE: maintenance
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DURABLE_REDIS_URL: ${DURABLE_REDIS_URL:?DURABLE_REDIS_URL is required}
      FEED_SCHEDULER_BATCH_SIZE: ${FEED_SCHEDULER_BATCH_SIZE:-}
      FEED_SCHEDULER_INTERVAL_MS: ${FEED_SCHEDULER_INTERVAL_MS:-}
      SAVED_MONITOR_BATCH_SIZE: ${SAVED_MONITOR_BATCH_SIZE:-}
      SAVED_MONITOR_MATCH_BATCH_SIZE: ${SAVED_MONITOR_MATCH_BATCH_SIZE:-}
      SAVED_MONITOR_INTERVAL_MS: ${SAVED_MONITOR_INTERVAL_MS:-}
      AUTH_TOKEN_MAINTENANCE_BATCH_SIZE: ${AUTH_TOKEN_MAINTENANCE_BATCH_SIZE:-}
      AUTH_TOKEN_MAINTENANCE_INTERVAL_MS: ${AUTH_TOKEN_MAINTENANCE_INTERVAL_MS:-}
      SECURITY_EVENT_MAINTENANCE_BATCH_SIZE: ${SECURITY_EVENT_MAINTENANCE_BATCH_SIZE:-}
      SECURITY_EVENT_MAINTENANCE_INTERVAL_MS: ${SECURITY_EVENT_MAINTENANCE_INTERVAL_MS:-}
      ARCTIC_IRC_ENABLED: ${ARCTIC_IRC_ENABLED:-false}
      ARCTIC_IRC_RETENTION_BATCH_SIZE: ${ARCTIC_IRC_RETENTION_BATCH_SIZE:-}
      ARCTIC_IRC_RETENTION_INTERVAL_MS: ${ARCTIC_IRC_RETENTION_INTERVAL_MS:-}
      ARCTIC_IRC_RETENTION_MAX_BATCHES: ${ARCTIC_IRC_RETENTION_MAX_BATCHES:-}
      ARCTIC_IRC_RETENTION_MAX_RUNTIME_MS: ${ARCTIC_IRC_RETENTION_MAX_RUNTIME_MS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "const fs = require('node:fs'); try { const age = Date.now() - fs.statSync('/tmp/arctic-rss-worker-heartbeat-maintenance').mtimeMs; process.exit(age < 90000 ? 0 : 1) } catch { process.exit(1) }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker-chat-events:
    <<: *worker-runtime
    profiles: ["chat-workers"]
    cpus: 0.35
    mem_limit: 384m
    pids_limit: 128
    environment:
      ARCTIC_RSS_SERVICE_ROLE: worker-chat-events
      NODE_OPTIONS: "--max-old-space-size=256"
      WORKER_MODE: chat-events
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DURABLE_REDIS_URL: ${DURABLE_REDIS_URL:?DURABLE_REDIS_URL is required}
      EPHEMERAL_REDIS_URL: ${EPHEMERAL_REDIS_URL:?EPHEMERAL_REDIS_URL is required}
      CHAT_EVENT_OUTBOX_PUBLISH_INTERVAL_MS: ${CHAT_EVENT_OUTBOX_PUBLISH_INTERVAL_MS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "const fs = require('node:fs'); try { const age = Date.now() - fs.statSync('/tmp/arctic-rss-worker-heartbeat-chat-events').mtimeMs; process.exit(age < 90000 ? 0 : 1) } catch { process.exit(1) }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  chat-gateway:
    image: ${CHAT_GATEWAY_IMAGE:-arctic-rss-chat-gateway}
    build:
      context: .
      target: chat-gateway
    # Chat remains deliberately opt-in until the private beta has an approved
    # reverse-proxy/tunnel route for the canonical browser origin.
    profiles: ["chat"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    environment:
      ARCTIC_RSS_SERVICE_ROLE: chat-gateway
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      EPHEMERAL_REDIS_URL: ${EPHEMERAL_REDIS_URL:?EPHEMERAL_REDIS_URL is required}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      ARCTIC_IRC_ENABLED: ${ARCTIC_IRC_ENABLED:-false}
      ARCTIC_IRC_TOKEN_SECRET: ${ARCTIC_IRC_TOKEN_SECRET:?ARCTIC_IRC_TOKEN_SECRET is required}
      ARCTIC_IRC_TOKEN_TTL_SECONDS: ${ARCTIC_IRC_TOKEN_TTL_SECONDS:-60}
      ARCTIC_IRC_AUTHORIZATION_MAX_AGE_SECONDS: ${ARCTIC_IRC_AUTHORIZATION_MAX_AGE_SECONDS:-60}
      ARCTIC_IRC_REDIS_DEGRADED_GRACE_SECONDS: ${ARCTIC_IRC_REDIS_DEGRADED_GRACE_SECONDS:-90}
      ARCTIC_IRC_MAX_SOCKETS_PER_USER: ${ARCTIC_IRC_MAX_SOCKETS_PER_USER:-5}
      ARCTIC_IRC_MAX_SOCKETS_PER_IP: ${ARCTIC_IRC_MAX_SOCKETS_PER_IP:-20}
      ARCTIC_IRC_MAX_ROOMS_PER_SOCKET: ${ARCTIC_IRC_MAX_ROOMS_PER_SOCKET:-20}
      ARCTIC_IRC_MAX_EVENT_PAYLOAD_BYTES: ${ARCTIC_IRC_MAX_EVENT_PAYLOAD_BYTES:-65536}
      ARCTIC_IRC_MAX_MALFORMED_EVENTS: ${ARCTIC_IRC_MAX_MALFORMED_EVENTS:-5}
      ARCTIC_IRC_MAX_OUTSTANDING_OPERATIONS: ${ARCTIC_IRC_MAX_OUTSTANDING_OPERATIONS:-8}
      CHAT_GATEWAY_PORT: ${CHAT_GATEWAY_PORT:-3001}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-ephemeral:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Deliberately no host `ports:` mapping. The configured tunnel/reverse
    # proxy is the only permitted browser-facing route to this service.
    logging:
      driver: journald

  edge-proxy:
    image: ${EDGE_PROXY_IMAGE:-arctic-rss-edge-proxy}
    build:
      context: .
      target: edge-proxy
    profiles: ["chat"]
    init: true
    restart: unless-stopped
    user: nginx
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,mode=1777
      - /var/run:rw,noexec,nosuid,size=1m,mode=1777
    cap_drop:
      - ALL
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
      chat-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Deliberately no host `ports:` mapping. The managed tunnel is switched to
    # this internal proxy only after the approved release has been verified.
    logging:
      driver: journald

  cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    profiles: ["tunnel"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: journald

volumes:
  postgres-data:
  redis-data:
