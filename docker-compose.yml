x-worker-durable-dependencies: &worker-durable-dependencies
  migrate:
    condition: service_completed_successfully
  redis:
    condition: service_healthy

x-worker-realtime-dependencies: &worker-realtime-dependencies
  migrate:
    condition: service_completed_successfully
  redis:
    condition: service_healthy
  redis-ephemeral:
    condition: service_healthy

x-worker-runtime: &worker-runtime
  image: ${WORKER_IMAGE:-arctic-rss-worker}
  build:
    context: .
    target: worker
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 60s
  command: ["node", "worker.mjs"]
  logging:
    driver: journald

services:
  postgres:
    # PostgreSQL 17.10 on Alpine 3.23 (multi-architecture manifest digest).
    image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 512m
    pids_limit: 128
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arctic_rss}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # The connection budget is calculated from this explicit ceiling rather
    # than inheriting an image default that could vary on a future upgrade.
    command: ["postgres", "-c", "max_connections=100"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging:
      driver: journald
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    # The gateway needs PostgreSQL until Phase 7D introduces its restricted
    # database role, but it must never share the durable Redis network.
    networks:
      - durable-data
      - web-edge

  redis:
    # Durable Redis 7.4.9 on Alpine 3.21 (multi-architecture manifest digest).
    image: redis:7.4.9-alpine3.21@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 320m
    pids_limit: 64
    environment:
      DURABLE_REDIS_USERNAME: ${DURABLE_REDIS_USERNAME:?DURABLE_REDIS_USERNAME is required}
      DURABLE_REDIS_PASSWORD: ${DURABLE_REDIS_PASSWORD:?DURABLE_REDIS_PASSWORD is required}
    # Durable BullMQ data must never be evicted. Keep a memory margin below the
    # container limit so Redis can safely rewrite AOF files under load.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--auto-aof-rewrite-min-size", "64mb", "--auto-aof-rewrite-percentage", "100", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--user", "${DURABLE_REDIS_USERNAME:?DURABLE_REDIS_USERNAME is required}", "on", ">${DURABLE_REDIS_PASSWORD:?DURABLE_REDIS_PASSWORD is required}", "~*", "&*", "+@all", "-@admin", "-@dangerous", "+info", "--user", "default", "off"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user \"$${DURABLE_REDIS_USERNAME}\" -a \"$${DURABLE_REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data
    logging:
      driver: journald
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - durable-data

  redis-ephemeral:
    # Ephemeral Redis 7.4.9 on Alpine 3.21 (multi-architecture manifest digest).
    image: redis:7.4.9-alpine3.21@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 192m
    pids_limit: 64
    environment:
      EPHEMERAL_REDIS_USERNAME: ${EPHEMERAL_REDIS_USERNAME:?EPHEMERAL_REDIS_USERNAME is required}
      EPHEMERAL_REDIS_PASSWORD: ${EPHEMERAL_REDIS_PASSWORD:?EPHEMERAL_REDIS_PASSWORD is required}
    # Socket.IO, presence, replay, rate-limit, and security-event state is
    # intentionally disposable. Every application key has a bounded TTL, so
    # volatile-ttl can reclaim the shortest-lived state under memory pressure.
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl", "--user", "${EPHEMERAL_REDIS_USERNAME:?EPHEMERAL_REDIS_USERNAME is required}", "on", ">${EPHEMERAL_REDIS_PASSWORD:?EPHEMERAL_REDIS_PASSWORD is required}", "~*", "&*", "+@all", "-@admin", "-@dangerous", "+info", "--user", "default", "off"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user \"$${EPHEMERAL_REDIS_USERNAME}\" -a \"$${EPHEMERAL_REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: journald
    # Loopback only preserves direct-host development and operator diagnostics;
    # no Redis service is reachable from the public network.
    ports:
      - "127.0.0.1:${EPHEMERAL_REDIS_PORT:-6380}:6379"
    networks:
      - ephemeral-realtime

  migrate:
    image: ${MIGRATE_IMAGE:-arctic-rss-migrate}
    build:
      context: .
      target: migrate
    environment:
      # Production migrations use a distinct role that owns the schema. The
      # web and worker containers retain the lower-privilege DATABASE_URL.
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?MIGRATE_DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: journald
    networks:
      - web-edge

  web:
    image: ${WEB_IMAGE:-arctic-rss-web}
    build:
      context: .
      target: runner
      args:
        APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cpus: 0.75
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    environment:
      ARCTIC_RSS_SERVICE_ROLE: web
      # The approved release command injects the manifest-selected topology.
      # The all-in-one default keeps direct local Compose use deterministic.
      ARCTIC_RSS_TOPOLOGY: ${ARCTIC_RSS_TOPOLOGY:-all-in-one}
      FEED_SCHEDULER_INTERVAL_MS: ${FEED_SCHEDULER_INTERVAL_MS:-60000}
      INGESTION_MAX_AGGREGATE_CONTENT_BYTES: ${INGESTION_MAX_AGGREGATE_CONTENT_BYTES:-}
      INGESTION_MAX_AUTHOR_CHARACTERS: ${INGESTION_MAX_AUTHOR_CHARACTERS:-}
      INGESTION_MAX_CONTENT_BYTES_PER_FIELD: ${INGESTION_MAX_CONTENT_BYTES_PER_FIELD:-}
      INGESTION_MAX_DISCOVERY_CANDIDATES: ${INGESTION_MAX_DISCOVERY_CANDIDATES:-}
      INGESTION_MAX_DISCOVERY_DURATION_MS: ${INGESTION_MAX_DISCOVERY_DURATION_MS:-}
      INGESTION_MAX_EXTERNAL_ID_BYTES: ${INGESTION_MAX_EXTERNAL_ID_BYTES:-}
      INGESTION_MAX_FEED_ITEMS: ${INGESTION_MAX_FEED_ITEMS:-}
      INGESTION_MAX_PODCAST_EPISODES: ${INGESTION_MAX_PODCAST_EPISODES:-}
      INGESTION_MAX_SUMMARY_CHARACTERS: ${INGESTION_MAX_SUMMARY_CHARACTERS:-}
      INGESTION_MAX_TITLE_CHARACTERS: ${INGESTION_MAX_TITLE_CHARACTERS:-}
      INGESTION_MAX_URL_CHARACTERS: ${INGESTION_MAX_URL_CHARACTERS:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_POOL_MAX: "6"
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-3000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-10000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      DB_APPLICATION_NAME: arctic-rss-web
      DURABLE_REDIS_URL: ${DURABLE_REDIS_URL:?DURABLE_REDIS_URL is required}
      EPHEMERAL_REDIS_URL: ${EPHEMERAL_REDIS_URL:?EPHEMERAL_REDIS_URL is required}
      ARCTIC_RSS_ALLOW_LEGACY_REDIS_URL_FOR_MIGRATION: ${ARCTIC_RSS_ALLOW_LEGACY_REDIS_URL_FOR_MIGRATION:-false}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      MOBILE_NATIVE_AUTHORIZATION_ENABLED: ${MOBILE_NATIVE_AUTHORIZATION_ENABLED:-false}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_URL: ${AUTH_URL:?AUTH_URL is required}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-}
      SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-}
      SMTP_SEND_TIMEOUT_MS: ${SMTP_SEND_TIMEOUT_MS:-}
      SMTP_POOL_MAX_CONNECTIONS: ${SMTP_POOL_MAX_CONNECTIONS:-}
      TURNSTILE_REQUIRED: ${TURNSTILE_REQUIRED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-}
      AI_DIGEST_MODEL: ${AI_DIGEST_MODEL:-}
      STORY_COMPARISON_MODEL: ${STORY_COMPARISON_MODEL:-}
      ARCTIC_IRC_ENABLED: ${ARCTIC_IRC_ENABLED:-false}
      ARCTIC_IRC_BETA_ALLOWLIST_ENABLED: ${ARCTIC_IRC_BETA_ALLOWLIST_ENABLED:-false}
      ARCTIC_IRC_GUEST_PREVIEW_ENABLED: ${ARCTIC_IRC_GUEST_PREVIEW_ENABLED:-false}
      ARCTIC_IRC_ROOM_CREATION_ENABLED: ${ARCTIC_IRC_ROOM_CREATION_ENABLED:-false}
      ARCTIC_IRC_DMS_ENABLED: ${ARCTIC_IRC_DMS_ENABLED:-false}
      ARCTIC_IRC_BOT_ENABLED: ${ARCTIC_IRC_BOT_ENABLED:-false}
      ARCTIC_IRC_EXTERNAL_ENABLED: ${ARCTIC_IRC_EXTERNAL_ENABLED:-false}
      ARCTIC_IRC_EXTERNAL_OFTC_ENABLED: ${ARCTIC_IRC_EXTERNAL_OFTC_ENABLED:-false}
      ARCTIC_IRC_EXTERNAL_LIBERA_ENABLED: ${ARCTIC_IRC_EXTERNAL_LIBERA_ENABLED:-false}
      ARCTIC_IRC_TOKEN_SECRET: ${ARCTIC_IRC_TOKEN_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-ephemeral:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/live').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    logging:
      driver: journald
    networks:
      - durable-data
      - ephemeral-realtime
      - web-edge

  worker:
    <<: *worker-runtime
    depends_on: *worker-realtime-dependencies
    profiles: ["all-in-one"]
    cpus: 0.75
    mem_limit: 1g
    pids_limit: 256
    environment:
      ARCTIC_RSS_SERVICE_ROLE: worker-all
      NODE_OPTIONS: "--max-old-space-size=640"
      WORKER_MODE: "all"
      ARCTIC_RSS_BUILD_SHA: ${ARCTIC_RSS_BUILD_SHA:-unknown}
